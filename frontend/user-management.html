<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 - A股监控</title>
<link rel="stylesheet" href="css/style.css">
<style>
.page-container { max-width: 700px; margin: 40px auto; padding: 0 16px; }
.page-header { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
.page-header h1 { font-size:20px; font-weight:700; }
.user-table { width:100%; border-collapse:collapse; font-size:13px; }
.user-table th { padding:10px 14px; text-align:left; color:var(--text-muted); font-weight:500; background:var(--bg-secondary); }
.user-table td { padding:11px 14px; border-bottom:1px solid var(--border); }
.role-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.role-badge.admin { background:rgba(79,142,247,0.15); color:var(--accent-blue); }
.role-badge.user  { background:rgba(46,204,113,0.12); color:var(--accent-green); }
.add-form { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:20px; }
.add-form .form-group { flex:1; min-width:140px; }
.add-form label { display:block; font-size:12px; color:var(--text-secondary); margin-bottom:5px; }
.add-form input { width:100%; padding:8px 12px; border-radius:6px; font-size:13px; background:var(--bg-tertiary); border:1px solid var(--border); color:var(--text-primary); }
.add-form input:focus { border-color:var(--accent-blue); outline:none; }
</style>
</head>
<body>
<div class="app">
  <nav class="navbar">
    <div class="navbar-logo">股票<span>监控</span></div>
    <div class="navbar-spacer"></div>
    <button class="btn btn-ghost btn-sm" onclick="location.href='/'">← 返回主页</button>
  </nav>
  <div class="page-container">
    <div class="page-header">
      <h1>👥 用户管理</h1>
      <span id="adminTag" style="font-size:12px;color:var(--accent-blue)"></span>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">用户列表</span></div>
      <div class="card-body" style="padding:0">
        <table class="user-table">
          <thead><tr><th>用户名</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody id="userTableBody"><tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted)">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-header"><span class="card-title">添加用户</span></div>
      <div class="card-body" style="padding:16px">
        <div class="add-form">
          <div class="form-group">
            <label>用户名（字母开头，字母数字下划线）</label>
            <input type="text" id="newUsername" placeholder="如：zhangsan">
          </div>
          <div class="form-group">
            <label>密码（至少6位，含字母和数字）</label>
            <input type="password" id="newPassword" placeholder="密码">
          </div>
          <div class="form-group" style="min-width:100px;max-width:120px">
            <label>角色</label>
            <select id="newRole" style="width:100%;padding:8px 10px;border-radius:6px;background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);font-size:13px">
              <option value="user">普通用户</option>
              <option value="admin">管理员</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="addUser()">添加</button>
        </div>
        <div id="addError" style="color:var(--accent-red);font-size:12px;margin-top:8px;display:none"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>
function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`; el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

async function checkAdmin() {
  const r = await fetch('/api/auth/check', { credentials:'include' });
  const data = await r.json();
  if (!data.logged_in || data.user.role !== 'admin') {
    location.href = '/'; return;
  }
  document.getElementById('adminTag').textContent = `管理员：${data.user.username}`;
}

async function loadUsers() {
  const r = await fetch('/api/auth/users', { credentials:'include' });
  const data = await r.json();
  if (!data.success) { location.href = '/'; return; }
  const tbody = document.getElementById('userTableBody');
  if (!data.users.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted)">暂无用户</td></tr>';
    return;
  }
  tbody.innerHTML = data.users.map(u => `
    <tr>
      <td>${u.username}</td>
      <td><span class="role-badge ${u.role}">${u.role === 'admin' ? '管理员' : '普通用户'}</span></td>
      <td style="color:var(--text-muted);font-size:12px">${u.created_at ? u.created_at.slice(0,10) : '--'}</td>
      <td>${u.username === 'admin' ? '<span style="color:var(--text-muted);font-size:12px">不可删除</span>' :
        `<button class="btn btn-danger btn-sm" onclick="deleteUser('${u.username}')">删除</button>`}</td>
    </tr>`).join('');
}

async function deleteUser(username) {
  if (!confirm(`确定删除用户 ${username}？`)) return;
  const r = await fetch(`/api/auth/users/${username}`, { method:'DELETE', credentials:'include' });
  const data = await r.json();
  if (data.success) { toast('已删除', 'success'); loadUsers(); }
  else toast(data.message || '删除失败', 'error');
}

async function addUser() {
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const role     = document.getElementById('newRole').value;
  const errEl    = document.getElementById('addError');
  errEl.style.display = 'none';
  const r = await fetch('/api/auth/users', {
    method:'POST', credentials:'include',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ username, password, role }),
  });
  const data = await r.json();
  if (data.success) {
    toast('添加成功', 'success');
    document.getElementById('newUsername').value = '';
    document.getElementById('newPassword').value = '';
    loadUsers();
  } else {
    errEl.textContent = data.message || '添加失败';
    errEl.style.display = 'block';
  }
}

checkAdmin().then(loadUsers);
</script>
</body>
</html>
